# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

# 打 tag 或手动触发时执行完整发布：
#   · 校验 tag ↔ package.json 版本一致
#   · 运行仓库自检（client.js 可复现、bundle 契约、无头冒烟）
#   · 发布 npm（带 provenance，已存在的版本自动跳过）
#   · 打包 tarball + SHA-256，生成完整发布说明并创建/更新 GitHub Release
#
# 必需 Secret：NPM_TOKEN（npm granular token，对包有 read/write 权限）。
# provenance 还要求仓库为 public 且允许 id-token: write。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 要发布的 Git ref（分支或 tag）
        required: false
        default: master

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: '@xiaopb/dsh-roboto-mono'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: publish npm + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0 # 生成变更日志需要完整历史与 tag

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # ============ 版本与 tag 校验 ============
      - name: Resolve version and check the tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::package.json version '$VERSION' is not SemVer"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version v$VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "releasing $PACKAGE_NAME@$VERSION (tag v$VERSION)"

      # ============ 自检 ============
      - name: Install
        run: npm ci

      - name: Run the release checks
        run: npm run check

      # ============ 发布 npm ============
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not configured"
            exit 1
          fi
          if npm view "$PACKAGE_NAME@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::$PACKAGE_NAME@$VERSION is already on npm; skipping publish"
          else
            npm publish --provenance --access public
          fi

      # ============ 打包与校验和 ============
      - name: Pack the tarball
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack 2>/dev/null | tail -n1)"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          echo "SHA256=$(cut -d' ' -f1 "$TARBALL.sha256")" >> "$GITHUB_ENV"
          ls -lh "$TARBALL" "$TARBALL.sha256"
          cat "$TARBALL.sha256"

      # ============ 生成完整发布说明（与 CI 共用同一脚本） ============
      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh release-notes.md
          echo "----- release-notes.md -----"
          cat release-notes.md

      # ============ 创建 / 更新 Release ============
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: dsh-roboto-mono ${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize
        shell: bash
        run: |
          {
            echo "### Released"
            echo ""
            echo "- npm: [\`$PACKAGE_NAME@$VERSION\`](https://www.npmjs.com/package/$PACKAGE_NAME/v/$VERSION)"
            echo "- GitHub Release: \`$TAG\`（附件 \`$TARBALL\`、\`$TARBALL.sha256\`）"
            echo "- SHA-256: \`$SHA256\`"
            echo "- 安装: \`dsh plugin --profile web add $PACKAGE_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"
