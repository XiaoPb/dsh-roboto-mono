# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (no dependencies, keeps the lockfile honest)
        run: npm ci

      - name: Check manifest, bundle patch and client bundle
        run: npm run check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Pack the tarball
        shell: bash
        run: |
          set -euo pipefail
          npm pack 2>/dev/null | tail -n1 > tarball.txt
          cat tarball.txt

      - name: Validate the release notes generator
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TARBALL="$(cat tarball.txt)"
          SHA256="$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          TAG="v$VERSION" VERSION="$VERSION" PACKAGE_NAME="@xiaopb/dsh-roboto-mono" \
            TARBALL="$TARBALL" SHA256="$SHA256" \
            bash scripts/release-notes.sh "$RUNNER_TEMP/release-notes.md"
          grep -q '^## 版本信息' "$RUNNER_TEMP/release-notes.md"
          grep -q '^## 安装' "$RUNNER_TEMP/release-notes.md"
          grep -q '^## 发布产物' "$RUNNER_TEMP/release-notes.md"
          grep -q '^## 变更内容' "$RUNNER_TEMP/release-notes.md"
          grep -q '^## 贡献者' "$RUNNER_TEMP/release-notes.md"
          grep -q "$SHA256" "$RUNNER_TEMP/release-notes.md"
          echo "release notes: $(wc -l < "$RUNNER_TEMP/release-notes.md") lines"

      - name: Install the packed bundle like a consumer
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(cat tarball.txt)"
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$TARBALL"
          PKG="$RUNNER_TEMP/consumer/node_modules/@xiaopb/dsh-roboto-mono"
          node -e "const p = require('$PKG/package.json'); if (p.dsh?.bundle?.patch !== './cordis.patch.yml') throw new Error('dsh.bundle.patch missing'); if (p.dsh?.client?.platform !== 'web') throw new Error('dsh.client missing');"
          node --input-type=module -e "import('$PKG/index.js').then((m) => { if (typeof m.apply !== 'function') throw new Error('host entry is not importable'); })"
          test -f "$PKG/client.js"
          test -f "$PKG/cordis.patch.yml"
          test -f "$PKG/fonts/OFL.txt"
          echo "installed bundle: $(node -p "require('$PKG/package.json').name + '@' + require('$PKG/package.json').version")"
